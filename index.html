<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuv Jain Concert Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Anuv Jain Live Concert 🎵</h1>
        <img src="anuv.jpg" alt="Anuv Jain Concert Banner">

        <div class="details">
            <h2>Event Details</h2>
            <p><strong>Date:</strong> 22 December 2026</p>
            <p><strong>Venue:</strong> Kochi Stadium</p>
            <p><strong>Available Tickets:</strong> 
                <span id="tickets">100</span>
            </p>
        </div>

        <button id="bookBtn">Book Ticket</button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
